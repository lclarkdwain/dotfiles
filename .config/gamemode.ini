; Feral GameMode configuration
;
; gamemoded merges gamemode.ini from /usr/share/gamemode/, /etc/, then
; $XDG_CONFIG_HOME, then $PWD -- so this file overrides the packaged defaults
; without replacing them. Option names verified against gamemoded(8).
;
; Unrelated to Caelestia's gameMode toggle, which only turns off compositor
; effects. This one handles the CPU governor and scheduling.

[general]
; desiredgov is deliberately left unset. Unset means gamemoded's default,
; "performance", which is what the desktop wants: its amd-pstate-epp "powersave"
; governor is EPP-driven, and a game benefits from being told not to trade
; clocks for efficiency. A laptop that would rather stay cool sets desiredgov in
; /etc/gamemode.ini (configure-gamemode-governor.sh); setting it here would
; override that file on every machine.

; defaultgov is deliberately left unset. Unset means gamemoded restores whatever
; the governor actually was on exit; pinning it here would silently override a
; later change to the system default.

; -1 turns off iGPU power balancing: games run on the NVIDIA dGPU on every machine.
; gamemoded logs -1 as "invalid"; that is how it reports the feature off.
igpu_power_threshold=-1

; Negated and applied as a nice value, so 10 means nice -10 -- matching the
; ceiling in /etc/security/limits.d/10-gamemode.conf, which the package ships
; as "@gamemode - nice -10".
;
; REQUIRES the invoking user to be in the "gamemode" group. That group also
; gates the polkit helpers (cpugovctl, and so desiredgov above), because the
; shipped policy denies allow_active/allow_any outright and gamemode.rules only
; grants on group membership. install-gaming.sh adds the user; it takes effect
; on next login, not immediately.
renice=10

; Best-effort I/O class at highest priority, so shader compilation and asset
; streaming are not starved by background writes. 0 is already the default;
; stated explicitly because it is easy to assume otherwise.
ioprio=0

; Nothing provides org.freedesktop.ScreenSaver under Caelestia, so this is a no-op;
; the game tag's idle_inhibit in hypr/hyprland/rules.lua keeps the screen awake.
inhibit_screensaver=1

; SCHED_ISO is not implemented in upstream kernels, so "auto" would silently do
; nothing on this machine. Left off to avoid implying otherwise.
softrealtime=off

; The [gpu] section is intentionally absent. Its NVIDIA controls
; (nv_powermizer_mode and the clock offsets) require the coolbits extension via
; nvidia-xconfig, which is X11-only and does nothing under a Wayland session.
;
; The [cpu] section is intentionally absent too: the defaults pin games to the
; P-cores on Intel hybrids and do nothing on homogeneous CPUs like the 5600X.
