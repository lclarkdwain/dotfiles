### MangoHud configuration
###
### Full option reference: /usr/share/doc/mangohud/MangoHud.conf.example
### Every key below was checked against that file -- MangoHud silently ignores
### options it does not recognise, so a typo here is invisible rather than an
### error. Per-game overrides go in the MANGOHUD_CONFIG environment variable.

### Start hidden ###############################################################
# The overlay is a diagnostic tool, not decoration. Launch clean and toggle it
# on when something feels wrong, rather than rendering it every session.
no_display

# Restated from the defaults so they are discoverable without opening the docs.
# Note the different modifier on each: right shift for the hud, left for logging.
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

### Frame cap ##################################################################
# 90 is half of the 180 Hz ultrawide, so frames pace evenly without VRR. The
# second value is what the toggle switches to: 0, uncapped.
fps_limit=90,0
toggle_fps_limit=Shift_L+F1

### What to show ###############################################################
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
cpu_stats
cpu_temp
cpu_mhz
vram
ram
fps
frametime
frame_timing
# Only renders while the GPU is actually throttling, so it costs no space until
# it matters -- which is the moment you most want to know.
throttling_status
gamemode

### Bottleneck at a glance #####################################################
# Colour the load figures past these thresholds so a CPU- vs GPU-bound situation
# reads instantly, instead of having to compare two numbers each frame.
gpu_load_change
gpu_load_value=60,90
cpu_load_change
cpu_load_value=60,90

### Placement and legibility ###################################################
# top-left keeps the overlay clear of centred crosshairs and of the bottom-right
# corner where most games put their own notifications.
position=top-left
font_size=20
background_alpha=0.4
round_corners=8
text_outline

### Logging ####################################################################
# Folder must exist (MangoHud won't create it); logs only while the HUD shows.
output_folder=~/mangologs
