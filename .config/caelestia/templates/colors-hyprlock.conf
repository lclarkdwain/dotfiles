# caelestia user template - rendered to ~/.local/state/caelestia/theme/ on every scheme change.
# Replaces wallust's colors-hyprland template, which stopped updating when wallust was retired.
# Variable names match wallust's output so hyprlock.conf keeps working unchanged.

$background = rgb({{ surface.hex }})
$foreground = rgb({{ onSurface.hex }})

# Material slots, for elements that must stay readable whatever the scheme does.
# hyprlock draws over the wallpaper, so a faithful terminal colour is not a
# contrast guarantee - move a label here if it washes out in a light scheme.
$surface = rgb({{ surface.hex }})
$onSurface = rgb({{ onSurface.hex }})
$primary = rgb({{ primary.hex }})
$onPrimary = rgb({{ onPrimary.hex }})
$outline = rgb({{ outline.hex }})
$error = rgb({{ error.hex }})

# Faithful terminal palette, same shape wallust emitted.
$color0 = rgb({{ term0.hex }})
$color1 = rgb({{ term1.hex }})
$color2 = rgb({{ term2.hex }})
$color3 = rgb({{ term3.hex }})
$color4 = rgb({{ term4.hex }})
$color5 = rgb({{ term5.hex }})
$color6 = rgb({{ term6.hex }})
$color7 = rgb({{ term7.hex }})
$color8 = rgb({{ term8.hex }})
$color9 = rgb({{ term9.hex }})
$color10 = rgb({{ term10.hex }})
$color11 = rgb({{ term11.hex }})
$color12 = rgb({{ term12.hex }})
$color13 = rgb({{ term13.hex }})
$color14 = rgb({{ term14.hex }})
$color15 = rgb({{ term15.hex }})
