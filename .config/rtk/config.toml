[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = false
consent_given = false
consent_date = "2026-08-28T17:40:46.897024232+00:00"

[hooks]
# Never rewrite these: Claude Code permission rules match on the command
# prefix, and an "aws ..." -> "rtk aws ..." rewrite can stop a soft_deny
# matcher (e.g. "aws * --profile *prod*") from matching.
exclude_commands = ["aws", "granted"]
transparent_prefixes = []

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000
