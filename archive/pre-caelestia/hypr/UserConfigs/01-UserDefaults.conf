# Data-only file. Hyprland does NOT load this in Lua mode.
#
# The authoritative values live in UserConfigs/user_defaults.lua. This file
# exists only because scripts/RofiSearch.sh and scripts/WaybarScripts.sh still
# read defaults from here (upstream has not migrated them to Lua). Both scripts
# strip "$" and eval the contents, so keep this to plain "$name = value" lines —
# no env= lines and no ${...} expansions.
#
# Keep in sync with UserConfigs/user_defaults.lua.

$term = wezterm
