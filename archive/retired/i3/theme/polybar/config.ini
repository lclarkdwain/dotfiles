;; Global WM Settings

[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ../system.ini
include-file = ./colors.ini
include-file = ./decor.ini
include-file = ./modules.ini

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 26
offset-x = 0
offset-y = 0

background = ${color.BACKGROUND}
foreground = ${color.FOREGROUND}

radius-top = 0.0
radius-bottom = 0.0

line-size = 2
line-color = ${color.ACCENT}

border-size = 6
border-color = ${color.BACKGROUND}

padding = 1
module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono NF:bold:size=10;3"
font-1 = "Symbols Nerd Font Mono:size=12;3"
font-2 = "Symbols Nerd Font Mono:size=20;4"
font-3 = "Iosevka Nerd Font Mono:bold:size=12;4"
font-4 = "archcraft:size=14;4"

modules-left = menu dot LD i3 RD dot LD tray RD dot LD mpd RD sep song
modules-center =
modules-right = volume dot bna dot btna dot bluetooth dot ethernet dot LD date RD dot sysmenu

separator =
spacing = 0
